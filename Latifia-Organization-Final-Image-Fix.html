<div id="drawer" class="fixed inset-0 z-[100] hidden"><div class="absolute inset-0 bg-black/60" onclick="closeDrawer()"></div><div class="absolute right-0 top-0 h-full w-[300px] bg-white rounded-l-[30px] p-6"><div class="flex justify-between"><p class="font-black">মেনু</p><button onclick="closeDrawer()" class="w-8 h-8 bg-zinc-100 rounded-full">✕</button></div><div class="mt-8 space-y-3"><button type="button" onclick="openPostModal()" class="w-full text-left p-4 border rounded-xl font-bold bg-emerald-50 text-emerald-800">📢 পোস্ট</button><a href="./about.html" class="block p-4 border rounded-xl font-bold">📜 সংগঠন পরিচিতি</a><a href="./members.html" class="block p-4 border rounded-xl font-bold">👥 সদস্য তালিকা</a><a href="./hisab.html" class="block p-4 border rounded-xl font-bold">💰 হিসাব তালিকা</a><a href="./contact.html" class="block p-4 border rounded-xl font-bold">📞 যোগাযোগ</a></div></div></div>

<!-- CONTENT - Desktop Grid -->
<div class="p-4 md:p-8 md:grid md:grid-cols-[1.2fr_0.8fr] md:gap-8">
<div>
<div class="bg-white border rounded-[24px] p-4 shadow-lg">
<div class="flex justify-between items-center mb-3"><p class="font-black text-[13px]">📢 প্রকাশিত পোস্ট</p><div class="flex gap-1"><input id="searchInput" placeholder="মাস/বছর সার্চ" class="border rounded-full px-3 py-1 text-[10px] w-[120px]"><button onclick="searchPost()" class="w-7 h-7 bg-black text-white rounded-full">🔍</button></div></div>

<div id="postModal" class="fixed inset-0 z-[120] hidden items-center justify-center bg-black/60 p-4" onclick="if(event.target===this)closePostModal()">
<div class="bg-white w-full max-w-lg rounded-[24px] p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
<div class="flex justify-between items-center mb-4"><p class="font-black text-[16px]">📝 নতুন পোস্ট</p><button type="button" onclick="closePostModal()" class="w-9 h-9 bg-zinc-100 rounded-full">✕</button></div>
<input id="postTitle" placeholder="টাইটেল লিখুন..." class="w-full border-2 rounded-xl p-3 text-[13px] outline-none focus:border-emerald-500">
<label class="block mt-3 text-[11px] font-bold text-zinc-600">🔐 অ্যাডমিন PIN
<input id="adminPin" type="password" inputmode="numeric" autocomplete="off" placeholder="আপনার গোপন অ্যাডমিন PIN" class="w-full border-2 rounded-xl p-3 mt-1 text-[13px] font-normal" required>
</label>
<textarea id="postDesc" placeholder="বিস্তারিত..." class="w-full border-2 rounded-xl p-3 mt-2 text-[12px] h-[100px]"></textarea>
<label class="block mt-2 text-[11px] font-bold text-zinc-600">📅 পোস্টের তারিখ নির্বাচন করুন
<input id="postDate" type="date" class="w-full border-2 rounded-xl p-3 mt-1 text-[13px] font-normal bg-white" required>
</label>
<div class="flex gap-2 mt-3"><label class="flex-1 bg-zinc-50 border-2 border-dashed border-emerald-300 rounded-xl p-3 text-center text-[11px] font-bold cursor-pointer">🖼️ ছবি এড করুন (সর্বোচ্চ ২০MB)<br><span id="fileName" class="text-[9px] text-zinc-400">অটো কম্প্রেস হবে</span><input id="postImage" type="file" accept="image/*" class="hidden"></label><button id="postBtn" onclick="createPost()" class="bg-emerald-600 text-white px-6 rounded-xl font-black">পোস্ট</button></div>
</div></div>
</div>
<div class="hidden md:block"><div class="bg-emerald-50 border border-emerald-100 rounded-[20px] p-6 sticky top-6"><p class="font-black text-emerald-800">ℹ️ নোটিশ</p><p class="text-[12px] mt-2 leading-6">GitHub এ <b>logo.png</b> এবং <b>bg.jpg</b> নামে ফাইল আপলোড করলে অটো বসে যাবে। ক্যাশ সমস্যা হলে Ctrl+F5 চাপুন।</p></div></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxfYzwaoBaW2wpRl_RnTdgUeRjoz7T9p9RAMqTfE5cnztgj4I5ZOHpL2LausajfBO8AQA/exec";
let allPosts=[];

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('ছবি পড়া যায়নি'));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('ছবিটি খোলা যায়নি'));
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        let w=img.width, h=img.height;
        const max=1280;
        if(w>max || h>max){ if(w>h){ h*=max/w; w=max; } else { w*=max/h; h=max; } }
        canvas.width=Math.round(w); canvas.height=Math.round(h);
        const ctx=canvas.getContext('2d');
        if(!ctx) return reject(new Error('ছবি কমপ্রেস করা যায়নি'));
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.7));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('postImage').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  if(f.size>20*1024*1024){alert('২০ MB-এর বেশি ছবি নেওয়া যাবে না'); e.target.value=''; return;}
  document.getElementById('fileName').innerText = f.name + ' ('+(f.size/1024/1024).toFixed(2)+'MB) — কমপ্রেস হবে';
});

async function loadPosts(){
  const postList=document.getElementById('postList');
  postList.innerHTML='<p class="text-center text-zinc-400 text-[12px] py-10">পোস্ট লোড হচ্ছে...</p>';
  try{
    const response=await fetch(API_URL+'?action=getPosts&_='+Date.now(), {method:'GET', cache:'no-store'});
    if(!response.ok) throw new Error('সার্ভার থেকে পোস্ট আনা যায়নি ('+response.status+')');
    const data=await response.json();
    if(!Array.isArray(data)){
      throw new Error(data && data.error ? data.error : 'সার্ভারের পোস্টের তথ্য সঠিক ফরম্যাটে নেই');
    }
    allPosts=data;
    render(allPosts);
  }catch(error){
    postList.innerHTML='<p class="text-center text-red-500 text-[12px] py-10">পোস্ট লোড করা যাচ্ছে না। ইন্টারনেট ও Apps Script deployment পরীক্ষা করুন।</p>';
    console.error('loadPosts:', error);
  }
}

function escapePostText(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function getPostImageUrl(post){
  // Support both the current API field and common legacy field names.
  const raw = post.img || post.image || post.imageUrl || post.Image || '';
  if (!raw) return '';
  const value = String(raw).trim();
  if (!value) return '';

  // Google Drive preview links are not always directly embeddable.
  // Convert Drive file URLs to the thumbnail endpoint for reliable <img> display.
  const idMatch = value.match(/(?:drive\.google\.com\/(?:file\/d\/|uc\?.*?id=|thumbnail\?.*?id=))([a-zA-Z0-9_-]+)/);
  if (idMatch && idMatch[1]) {
    return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(idMatch[1]) + '&sz=w1600';
  }
  return value;
}

function render(list){
  const postList=document.getElementById('postList');
  if(!Array.isArray(list) || !list.length){
    postList.innerHTML='<p class="text-center text-zinc-400 text-[12px] py-10">এখনো কোনো পোস্ট প্রকাশ করা হয়নি</p>';
    return;
  }
  postList.innerHTML=list.map(p=>{
    const imageUrl = getPostImageUrl(p);
    const image = imageUrl
      ? `<div class="w-full bg-zinc-50 flex justify-center"><img src="${escapePostText(imageUrl)}" alt="পোস্টের ছবি" loading="lazy" class="block w-full h-auto max-h-[650px] object-contain" referrerpolicy="no-referrer" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';const original='${escapePostText(p.img || p.image || p.imageUrl || p.Image || '')}';if(original && this.src!==original){this.src=original;}else{this.parentElement.style.display='none';}}else{this.parentElement.style.display='none';}"></div>`
      : '';
    return `<article class="bg-white border rounded-[20px] overflow-hidden shadow-sm">
      ${image}
      <div class="p-4"><p class="text-[10px] bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full inline-block font-bold">📅 ${escapePostText(p.dateStr || p.date || '')}</p><p class="font-black text-[17px] mt-2 break-words">${escapePostText(p.title || p.Title || '')}</p><p class="text-[12px] text-zinc-600 leading-6 whitespace-pre-wrap break-words">${escapePostText(p.desc || p.description || p.Description || '')}</p></div>
    </article>`;
  }).join('');
}
async function createPost(){
  const title=document.getElementById('postTitle').value.trim();
  const desc=document.getElementById('postDesc').value.trim();
  const pin=document.getElementById('adminPin').value.trim();
  const file=document.getElementById('postImage').files[0];
  const selectedDate=document.getElementById('postDate').value;
  if(!title){alert('পোস্টের টাইটেল লিখুন');return;}
  if(!selectedDate){alert('পোস্টের তারিখ নির্বাচন করুন');return;}
  if(!pin){alert('অ্যাডমিন PIN লিখুন');return;}

  const btn=document.getElementById('postBtn');
  btn.innerText='⏳ পাঠানো হচ্ছে'; btn.disabled=true;
  try{
    let base64='';
    if(file) base64=await compressImage(file);
    const [year,month,day]=selectedDate.split('-').map(Number);
    const dateStr=new Date(year,month-1,day).toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});
    const payload={
      action:'addPost', pin, title, desc, dateStr,
      imageBase64:base64,
      mimeType:'image/jpeg',
      fileName:file ? file.name : ''
    };
    const response=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)
    });
    if(!response.ok) throw new Error('সার্ভার ত্রুটি: '+response.status);
    const result=await response.json();
    if(!result || result.success!==true){
      throw new Error(result && result.error ? result.error : 'পোস্ট সংরক্ষণ নিশ্চিত করা যায়নি');
    }

    alert('✅ পোস্ট Google Sheet-এ সংরক্ষিত হয়েছে।');
    document.getElementById('postTitle').value='';
    document.getElementById('postDesc').value='';
    document.getElementById('adminPin').value='';
    document.getElementById('postImage').value='';
    document.getElementById('postDate').value='';
    document.getElementById('fileName').innerText='অটো কম্প্রেস হবে';
    closePostModal();
    await loadPosts();
  }catch(error){
    console.error('createPost:', error);
    alert('পোস্ট প্রকাশ করা যায়নি: '+(error.message || 'অজানা সমস্যা')+'\nApps Script-এর ADMIN_PIN এবং Web App deployment পরীক্ষা করুন।');
  }finally{
    btn.innerText='পোস্ট'; btn.disabled=false;
  }
}

function openPostModal(){closeDrawer();const m=document.getElementById('postModal');m.classList.remove('hidden');m.classList.add('flex');}
function closePostModal(){const m=document.getElementById('postModal');m.classList.add('hidden');m.classList.remove('flex');}
function searchPost(){ const q=document.getElementById('searchInput').value.toLowerCase(); if(!q){render(allPosts);return;} const f=allPosts.filter(p=>p.dateStr.toLowerCase().includes(q)||p.title.toLowerCase().includes(q)); render(f); }
document.getElementById('menuBtn').onclick=()=>document.getElementById('drawer').classList.remove('hidden');
function closeDrawer(){document.getElementById('drawer').classList.add('hidden');}
loadPosts();

</script>
