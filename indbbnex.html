<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>লতিফিয়া সংগঠন মীরের গাঁও</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>*{font-family:'Hind Siliguri',sans-serif} .card{border:1px solid #e7e5e4;background:#fff;border-radius:16px;padding:14px}</style>
</head>
<body class="bg-[#fafaf9]">
<div class="max-w-[420px] mx-auto min-h-screen bg-white shadow-sm border-x">
<header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b">
<div class="p-3 flex items-center justify-between">
<div class="flex items-center gap-3"><img id="logo" src="https://i.ibb.co/3mQ0XzK/logo.png" class="w-10 h-10 rounded-full border"><div><div class="font-bold text-[14px] leading-none">লতিফিয়া সংগঠন মীরের গাঁও</div><div id="dateLabel" class="text-[10px] text-zinc-500 mt-1"></div></div></div>
<button id="adminBtn" onclick="openPin()" class="text-[11px] font-bold bg-zinc-900 text-white px-3 py-2 rounded-full">এডমিন</button>
</div>
<div id="fundTop" class="mx-3 mb-3 bg-[#0a0a0a] text-white rounded-[14px] p-3 flex items-center justify-between">
<div><div class="text-[10px] opacity-70">সংগঠন ফান্ড</div><div id="fundAmount" class="font-bold text-[18px]">0৳</div></div>
<div class="text-right text-[10px] leading-[1.2] opacity-70">সাপ্তাহিক + ইসলামিক +<br>অন্যান্য আয়-ব্যয়</div>
</div>
<div class="px-3 pb-3 grid grid-cols-3 gap-2">
<button onclick="setTab('weekly')" id="b-weekly" class="py-2.5 rounded-full text-[12px] font-bold bg-emerald-600 text-white">সাপ্তাহিক</button>
<button onclick="setTab('islamic')" id="b-islamic" class="py-2.5 rounded-full text-[12px] font-bold bg-zinc-100">ইসলামিক</button>
<button onclick="setTab('other')" id="b-other" class="py-2.5 rounded-full text-[12px] font-bold bg-zinc-100">অন্যান্য</button>
</div>
</header>

<div id="tab-weekly" class="p-3">
<div class="card bg-emerald-50/50"><div class="text-[12px] font-bold mb-2">নতুন সদস্য</div><div class="grid grid-cols-2 gap-2"><input id="newName" placeholder="নাম" class="border rounded-full px-3 py-2.5 text-[13px]"><input id="newPorichoy" placeholder="পরিচয়" class="border rounded-full px-3 py-2.5 text-[13px]"></div><button onclick="addMember()" class="mt-2 w-full bg-zinc-900 text-white rounded-full py-2.5 text-[13px] font-bold">যোগ করুন</button></div>
<div id="currentSheet" class="mt-4 space-y-2"></div>
<div class="mt-4 card border-dashed"><div class="text-[11px] font-bold">খরচ</div><div class="flex gap-2 mt-2"><input id="expBiboron" placeholder="বিবরণ" class="flex-1 border rounded-full px-3 py-2 text-[12px]"><input id="expTaka" type="number" placeholder="টাকা" class="w-24 border rounded-full px-3 py-2 text-[12px]"></div><button onclick="addExp()" class="mt-2 w-full bg-zinc-100 rounded-full py-2 text-[11px] font-bold">যোগ</button><div id="expList" class="mt-2 text-[11px]"></div></div>
<div class="mt-3 grid grid-cols-3 gap-2 text-center"><div class="card"><div class="text-[10px]">জমা</div><div id="totalCollection" class="font-bold">0৳</div></div><div class="card"><div class="text-[10px]">খরচ</div><div id="totalExpense" class="font-bold">0৳</div></div><div class="card bg-zinc-900 text-white"><div class="text-[10px]">উদ্বৃত্ত</div><div id="totalRemain" class="font-bold">0৳</div></div></div>
<button onclick="saveWeekly()" class="w-full mt-3 bg-emerald-600 text-white rounded-full py-3 font-bold text-[13px]">সেভ করুন</button>
<div id="weeklyHistory" class="mt-6 space-y-2"></div>
</div>

<div id="tab-islamic" class="hidden p-3">
<div class="card bg-amber-50/70"><input id="eventName" placeholder="অনুষ্ঠানের নাম" class="w-full border rounded-full px-3 py-2.5 text-[13px] font-bold"><div class="grid grid-cols-2 gap-2 mt-3"><input id="islName" placeholder="নাম" class="border rounded-full px-3 py-2 text-[12px]"><input id="islPorichoy" placeholder="পরিচয়" class="border rounded-full px-3 py-2 text-[12px]"><input id="islTaka" type="number" placeholder="টাকা" class="border rounded-full px-3 py-2 text-[12px]"><input id="islData" placeholder="দাতা" class="border rounded-full px-3 py-2 text-[12px]"></div><button onclick="addIslamicDraft()" class="w-full mt-3 bg-zinc-900 text-white rounded-full py-2.5 text-[12px] font-bold">তালিকায় যোগ</button><div id="islamicDraftList" class="mt-3 bg-white rounded-xl p-2 border text-[11px]"></div><div class="flex gap-2 mt-3"><input id="islExp" type="number" placeholder="মোট খরচ" class="flex-1 border rounded-full px-3 py-2 text-[12px]"><button id="finalBtn" onclick="finalIslamicSave()" class="bg-emerald-600 text-white px-5 rounded-full text-[12px] font-bold">ফাইনাল সেভ</button></div></div>
<div id="islamicHistory" class="mt-4 space-y-2"></div>
</div>

<div id="tab-other" class="hidden p-3">
<div class="card"><div class="font-bold text-[12px]">অন্যান্য খরচ</div><div class="grid gap-2 mt-2"><input id="otherDate" type="date" class="border rounded-full px-3 py-2 text-[12px]"><input id="otherBiboron" placeholder="কিসের জন্য খরচ" class="border rounded-full px-3 py-2 text-[12px]"><input id="otherTaka" type="number" placeholder="টাকার পরিমাণ" class="border rounded-full px-3 py-2 text-[12px]"><input id="otherKhat" placeholder="খাত (যেমন: মাইক ভাড়া)" class="border rounded-full px-3 py-2 text-[12px]"><input id="otherSource" placeholder="কার থেকে মাইনাস (ফান্ড)" value="ফান্ড" class="border rounded-full px-3 py-2 text-[12px]"></div><button onclick="saveOtherExpense()" class="w-full mt-3 bg-red-600 text-white rounded-full py-2.5 text-[12px] font-bold">খরচ সেভ করুন</button></div>
<div class="card mt-3"><div class="font-bold text-[12px]">দাতা থেকে আয় (ফান্ডে যোগ হবে)</div><div class="grid gap-2 mt-2"><input id="incomeDate" type="date" class="border rounded-full px-3 py-2 text-[12px]"><input id="incomeDataName" placeholder="দাতার নাম" class="border rounded-full px-3 py-2 text-[12px]"><input id="incomeBiboron" placeholder="বিবরণ" class="border rounded-full px-3 py-2 text-[12px]"><input id="incomeTaka" type="number" placeholder="টাকা" class="border rounded-full px-3 py-2 text-[12px]"><input id="incomeSource" placeholder="উৎস" value="দাতা" class="border rounded-full px-3 py-2 text-[12px]"></div><button onclick="saveOtherIncome()" class="w-full mt-3 bg-emerald-600 text-white rounded-full py-2.5 text-[12px] font-bold">আয় যোগ করুন (ফান্ডে যাবে)</button></div>
<div id="otherExpenseHistory" class="mt-4 space-y-2"></div>
<div id="otherIncomeHistory" class="mt-4 space-y-2"></div>
</div>

<div id="poster" class="fixed left-[-9999px] top-0 w-[720px] bg-white p-6 border-[8px] border-emerald-700 rounded-[24px]">
<div class="flex items-center gap-3 border-b-2 pb-3"><img src="https://i.ibb.co/3mQ0XzK/logo.png" class="w-14 h-14 rounded-full"><div><div class="font-bold">লতিফিয়া সংগঠন মীরের গাঁও</div><div id="pTitle" class="text-[11px] font-bold"></div></div></div>
<div id="pBody" class="mt-4"></div><div id="pTotal" class="mt-4 bg-black text-white text-center py-3 rounded-xl font-bold"></div>
</div>
</div>

<div id="pinModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><input id="pinInput" type="password" placeholder="PIN = PM" class="w-full border rounded-full px-4 py-3"><div class="flex gap-2 mt-3"><button onclick="closePin()" class="flex-1 border rounded-full py-2">বন্ধ</button><button onclick="login()" class="flex-1 bg-black text-white rounded-full py-2 font-bold">প্রবেশ</button></div><div id="pinError" class="text-[11px] text-red-500 mt-2"></div></div></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbw_yV02PdYU9NfWwG-zaw3Vgl-w-Np328Jlx8JO-10NHVsEmGr_rY9RpWWLikXiTJmUPw/exec";
let PIN="", IS_ADMIN=false, WEEK_ID=getWeekId(new Date()), expenses=[], islamicDraft=[], currentEventId='EV-'+Date.now(), currentEventName='';
function getWeekId(d){ const y=d.getFullYear(); const jan1=new Date(y,0,1); const w=Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7); return `${y}-W${String(w).padStart(2,'0')}`; }
document.getElementById('dateLabel').innerText=new Date().toLocaleDateString('bn-BD',{weekday:'long', year:'numeric', month:'long', day:'numeric'})+' | '+WEEK_ID;
function openPin(){ document.getElementById('pinModal').classList.remove('hidden'); } function closePin(){ document.getElementById('pinModal').classList.add('hidden'); }
async function login(){ const p=document.getElementById('pinInput').value.trim(); const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'test', pin:p})}); const j=await r.json().catch(()=>({})); if(j.status=='wrong_pin'){ document.getElementById('pinError').innerText='ভুল PIN'; return;} PIN=p; IS_ADMIN=true; document.getElementById('adminBtn').innerText='এডমিন ✓'; closePin(); loadAll(); }
function setTab(t){ ['weekly','islamic','other'].forEach(x=>{ document.getElementById('tab-'+x).classList.toggle('hidden', x!==t); document.getElementById('b-'+x).className = x===t? 'py-2.5 rounded-full text-[12px] font-bold bg-emerald-600 text-white' : 'py-2.5 rounded-full text-[12px] font-bold bg-zinc-100'; }); }
async function loadAll(){ await loadCurrent(); await loadHistory(); await loadFund(); await loadIslamicHistory(); await loadOther(); }
async function addMember(){ if(!IS_ADMIN) return openPin(); const name=document.getElementById('newName').value.trim(); const porichoy=document.getElementById('newPorichoy').value.trim(); if(!name) return; const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'addMember', name, porichoy, pin:PIN})}); const j=await r.json(); if(j.status=='ok'){ document.getElementById('newName').value=''; document.getElementById('newPorichoy').value=''; loadCurrent(); } }
async function loadCurrent(){ const r=await fetch(API+'?action=getCurrent'); const vals=await r.json(); const c=document.getElementById('currentSheet'); c.innerHTML=''; if(vals.length<=1) return; vals.slice(1).forEach(row=>{ const d=document.createElement('div'); d.className='card'; d.innerHTML=`<div class="font-bold text-[13px]">${row[0]} <span class="text-[10px] text-zinc-500">(${row[1]||''})</span></div><div class="grid grid-cols-2 gap-2 mt-2"><input data-name="${row[0]}" data-field="taka" value="${row[2]||''}" placeholder="টাকা" class="border rounded-full px-3 py-2 text-[12px]"><input data-name="${row[0]}" data-field="data" value="${row[3]||''}" placeholder="দাতা" class="border rounded-full px-3 py-2 text-[12px]"></div>`; c.appendChild(d); }); calc(); }
function addExp(){ const b=document.getElementById('expBiboron').value; const t=document.getElementById('expTaka').value; if(!b||!t) return; expenses.push({biboron:b,taka:t}); document.getElementById('expBiboron').value=''; document.getElementById('expTaka').value=''; document.getElementById('expList').innerHTML=expenses.map((e,i)=>`<div class="flex justify-between border-b py-1"><span>${e.biboron}</span><span>${e.taka}৳</span></div>`).join(''); calc(); }
function calc(){ let total=0; document.querySelectorAll('[data-field="taka"]').forEach(inp=> total+=Number(inp.value||0)); let exp=expenses.reduce((s,e)=>s+Number(e.taka||0),0); document.getElementById('totalCollection').innerText=total+'৳'; document.getElementById('totalExpense').innerText=exp+'৳'; document.getElementById('totalRemain').innerText=(total-exp)+'৳'; return {total,exp}; }
async function saveWeekly(){ if(!IS_ADMIN) return openPin(); const {total,exp}=calc(); const items=[]; document.querySelectorAll('[data-field="taka"]').forEach(inp=>{ const name=inp.dataset.name; const taka=inp.value; const dVal=document.querySelector(`[data-name="${name}"][data-field="data"]`)?.value||''; if(taka||dVal) items.push({name, porichoy:"", taka, data:dVal}); }); if(!items.length) return alert('টাকা লিখুন'); const dateStr=new Date().toLocaleDateString('bn-BD'); const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'saveWeekly', weekId:WEEK_ID, dateStr, items, expenseTotal:exp, pin:PIN})}); const j=await r.json(); if(j.status=='ok'){ expenses=[]; document.getElementById('expList').innerHTML=''; loadHistory(); loadFund(); alert('সেভ হয়েছে'); } }
async function loadHistory(){ const r=await fetch(API+'?action=getWeeklyHistory'); const vals=await r.json(); const c=document.getElementById('weeklyHistory'); c.innerHTML=''; if(vals.length<=1) return; const groups={}; vals.slice(1).forEach(row=>{ const wid=row[0]; if(!groups[wid]) groups[wid]=[]; groups[wid].push(row); }); Object.keys(groups).reverse().forEach(wid=>{ const rows=groups[wid]; let total=0; rows.forEach(x=> total+=Number(x[4]||0)); const d=document.createElement('div'); d.className='card'; d.innerHTML=`<div class="flex justify-between items-center"><div><div class="font-bold text-[12px]">${wid}</div><div class="text-[10px] text-zinc-500">${rows[0][1]} | মোট ${total}৳</div></div><button onclick="downloadPoster('weekly','${wid}')" class="w-8 h-8 bg-zinc-100 rounded-full">⬇️</button></div>`; c.appendChild(d); }); }
function addIslamicDraft(){ if(!IS_ADMIN) return openPin(); const name=document.getElementById('islName').value.trim(); const porichoy=document.getElementById('islPorichoy').value.trim(); const taka=document.getElementById('islTaka').value.trim(); const data=document.getElementById('islData').value.trim(); const ev=document.getElementById('eventName').value.trim(); if(!ev) return alert('অনুষ্ঠানের নাম দিন'); if(!name && !taka) return alert('নাম বা টাকা দিন'); currentEventName=ev; islamicDraft.push({name,porichoy,taka,data}); document.getElementById('islName').value=''; document.getElementById('islPorichoy').value=''; document.getElementById('islTaka').value=''; document.getElementById('islData').value=''; renderIslamicDraft(); }
function renderIslamicDraft(){ const b=document.getElementById('islamicDraftList'); if(!islamicDraft.length){ b.innerHTML='তালিকা খালি'; return;} b.innerHTML=islamicDraft.map((d,i)=>`<div class="flex justify-between border-b py-1"><span>${d.name||'-'} | ${d.taka||0}৳</span><button onclick="islamicDraft.splice(${i},1);renderIslamicDraft()" class="text-red-500">x</button></div>`).join(''); }
async function finalIslamicSave(){ if(!IS_ADMIN) return openPin(); if(!currentEventName) currentEventName=document.getElementById('eventName').value.trim(); if(!currentEventName) return alert('অনুষ্ঠানের নাম'); if(!islamicDraft.length) return alert('তালিকায় যোগ করুন'); const dateStr=new Date().toLocaleDateString('bn-BD'); const exp=document.getElementById('islExp').value||0; const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'saveIslamicFinal', eventId:currentEventId, eventName:currentEventName, dateStr, items:islamicDraft, expenseTotal:exp, pin:PIN})}); const j=await r.json(); if(j.status=='ok'){ islamicDraft=[]; currentEventId='EV-'+Date.now(); document.getElementById('eventName').value=''; document.getElementById('islExp').value=''; renderIslamicDraft(); loadIslamicHistory(); loadFund(); alert('ইসলামিক সেভ হয়েছে'); } }
async function loadIslamicHistory(){ const r=await fetch(API+'?action=getIslamicHistory'); const vals=await r.json(); const c=document.getElementById('islamicHistory'); c.innerHTML=''; if(vals.length<=1) return; const groups={}; vals.slice(1).forEach(row=>{ const eid=row[0]; if(!groups[eid]) groups[eid]=[]; groups[eid].push(row); }); Object.keys(groups).reverse().forEach(eid=>{ const rows=groups[eid]; let total=0; rows.forEach(x=> total+=Number(x[5]||0)); const d=document.createElement('div'); d.className='card'; d.innerHTML=`<div class="flex justify-between"><div><div class="font-bold text-[12px]">${rows[0][1]}</div><div class="text-[10px] text-zinc-500">${rows[0][2]} | মোট ${total}৳</div></div><button onclick="downloadPoster('islamic','${eid}')" class="w-8 h-8 bg-zinc-100 rounded-full">⬇️</button></div>`; c.appendChild(d); }); }
async function saveOtherExpense(){ if(!IS_ADMIN) return openPin(); const dateStr=document.getElementById('otherDate').value||new Date().toLocaleDateString('bn-BD'); const biboron=document.getElementById('otherBiboron').value.trim(); const taka=document.getElementById('otherTaka').value.trim(); const khat=document.getElementById('otherKhat').value.trim(); const source=document.getElementById('otherSource').value.trim(); if(!biboron||!taka) return alert('বিবরণ ও টাকা দিন'); const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'saveOtherExpense', dateStr, biboron, taka, khat, source, pin:PIN})}); const j=await r.json(); if(j.status=='ok'){ alert('খরচ সেভ ও ফান্ড থেকে মাইনাস হয়েছে'); loadOther(); loadFund(); } }
async function saveOtherIncome(){ if(!IS_ADMIN) return openPin(); const dateStr=document.getElementById('incomeDate').value||new Date().toLocaleDateString('bn-BD'); const dataName=document.getElementById('incomeDataName').value.trim(); const biboron=document.getElementById('incomeBiboron').value.trim(); const taka=document.getElementById('incomeTaka').value.trim(); const source=document.getElementById('incomeSource').value.trim(); if(!taka) return alert('টাকা দিন'); const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'saveOtherIncome', dateStr, dataName, biboron, taka, source, pin:PIN})}); const j=await r.json(); if(j.status=='ok'){ alert('আয় ফান্ডে যোগ হয়েছে'); loadOther(); loadFund(); } }
async function loadOther(){
  const r1=await fetch(API+'?action=getOtherExpense'); const v1=await r1.json();
  const r2=await fetch(API+'?action=getOtherIncome'); const v2=await r2.json();
  const c1=document.getElementById('otherExpenseHistory'); c1.innerHTML='<div class="font-bold text-[11px] mt-2">খরচ তালিকা</div>';
  if(v1.length>1){ v1.slice(1).reverse().slice(0,20).forEach(row=>{ const d=document.createElement('div'); d.className='card flex justify-between'; d.innerHTML=`<div><div class="font-bold text-[11px]">${row[1]}</div><div class="text-[10px] text-zinc-500">${row[0]} | ${row[3]}</div></div><span class="font-bold text-[11px] text-red-600">${row[2]}৳</span>`; c1.appendChild(d); }); }
  const c2=document.getElementById('otherIncomeHistory'); c2.innerHTML='<div class="font-bold text-[11px] mt-4">আয় তালিকা</div>';
  if(v2.length>1){ v2.slice(1).reverse().slice(0,20).forEach(row=>{ const d=document.createElement('div'); d.className='card flex justify-between'; d.innerHTML=`<div><div class="font-bold text-[11px]">${row[1]} - ${row[2]}</div><div class="text-[10px] text-zinc-500">${row[0]}</div></div><span class="font-bold text-[11px] text-emerald-600">${row[3]}৳</span>`; c2.appendChild(d); }); }
}
async function loadFund(){ const r=await fetch(API+'?action=getFund'); const vals=await r.json(); let total=0; if(vals.length>1){ vals.slice(1).forEach(row=>{ const t=Number(row[3]||0); if(row[4]=='IN') total+=t; else total-=t; }); } document.getElementById('fundAmount').innerText=total+'৳'; }
async function downloadPoster(type, id){
  let rows=[], title='';
  if(type=='weekly'){ const r=await fetch(API+'?action=getWeeklyHistory'); const vals=await r.json(); rows=vals.slice(1).filter(v=>v[0]==id); title=id+' | '+rows[0][1]; }
  else if(type=='islamic'){ const r=await fetch(API+'?action=getIslamicHistory'); const vals=await r.json(); rows=vals.slice(1).filter(v=>v[0]==id); title=rows[0][1]+' | '+rows[0][2]; }
  else { title=id; rows=[['','',title,'','','','','']]; }
  document.getElementById('pTitle').innerText=title;
  let html='<table class="w-full text-[11px]"><tr class="bg-zinc-100"><th class="p-2 text-left">বিবরণ</th><th class="text-right">টাকা</th></tr>';
  let total=0;
  rows.forEach(r=>{
    if(type=='weekly'){ total+=Number(r[4]||0); html+=`<tr class="border-b"><td class="p-2">${r[2]} ${r[5]? '('+r[5]+')':''}</td><td class="p-2 text-right font-bold">${r[4]}৳</td></tr>`; }
    else if(type=='islamic'){ total+=Number(r[5]||0); html+=`<tr class="border-b"><td class="p-2">${r[3]} ${r[6]? '('+r[6]+')':''}</td><td class="p-2 text-right font-bold">${r[5]}৳</td></tr>`; }
  });
  html+='</table>';
  document.getElementById('pBody').innerHTML=html;
  document.getElementById('pTotal').innerText='মোট: '+total+'৳';
  const poster=document.getElementById('poster'); poster.style.left='0';
  const canvas=await html2canvas(poster,{scale:2}); const a=document.createElement('a'); a.download=title+'.png'; a.href=canvas.toDataURL(); a.click(); poster.style.left='-9999px';
}
loadAll(); renderIslamicDraft();
document.getElementById('logo').addEventListener('click',()=>{ if(!IS_ADMIN) openPin(); });
</script>
</body></html>
