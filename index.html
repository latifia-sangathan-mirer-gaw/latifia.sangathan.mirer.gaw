<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>লতিফিয়া সংগঠন — হিসাব তালিকা</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;900&display=swap');
*{font-family:'Hind Siliguri',sans-serif}
.member-card{border:1px solid #e5e7eb;border-radius:18px;background:white;padding:14px}
.poster-box{width:760px;background:white;padding:24px;border:6px solid #047857;border-radius:28px}
</style></head>
<body class="bg-[#f6f5ef]">
<div class="max-w-3xl mx-auto min-h-screen bg-white shadow-xl">
<header class="sticky top-0 z-20 bg-white border-b p-3 flex items-center justify-between">
<div class="flex items-center gap-3">
<img id="brandLogo" src="https://i.ibb.co/3mQ0XzK/logo.png" class="w-12 h-12 rounded-full border-2 border-yellow-400">
<div><div class="font-black text-[16px]">লতিফিয়া সংগঠন মীরের গাঁও</div><div id="weekLabel" class="text-[11px] text-zinc-500 font-bold"></div></div>
</div>
<button id="adminBtn" onclick="openPin()" class="px-4 py-2 rounded-full bg-black text-white text-[12px] font-bold">🔐 এডমিন</button>
</header>

<div class="p-3 grid grid-cols-2 gap-2">
<button onclick="setTab('weekly')" id="t-weekly" class="p-3 rounded-xl font-black bg-emerald-700 text-white">📅 সাপ্তাহিক মিলাদ</button>
<button onclick="setTab('islamic')" id="t-islamic" class="p-3 rounded-xl font-black bg-zinc-100">🕌 ইসলামিক অনুষ্ঠান</button>
</div>

<div id="tab-weekly">
<div class="p-4 bg-emerald-50/70 border-y">
<div class="font-black text-[13px] mb-2">নতুন সদস্য যোগ করুন</div>
<div class="grid grid-cols-2 gap-2">
<input id="newName" placeholder="সদস্যের নাম" class="border-2 rounded-xl p-3 text-[13px]">
<input id="newPorichoy" placeholder="সদস্যের পরিচয়" class="border-2 rounded-xl p-3 text-[13px]">
</div>
<button onclick="addMember()" class="w-full mt-2 bg-black text-white p-3 rounded-xl font-black text-[13px]">💾 সেভ করুন (A=নাম B=পরিচয় ফিক্সড)</button>
</div>
<div class="p-3">
<div class="flex justify-between items-center mb-2"><b class="text-[13px]">এই সপ্তাহের শিট (C,D লিখুন)</b><span class="text-[10px] bg-yellow-100 px-2 py-1 rounded-full">বুধবার অটো ০</span></div>
<div id="currentSheet" class="space-y-2"></div>
<div class="mt-3 border-2 border-dashed rounded-xl p-3">
<div class="font-bold text-[12px]">এই সপ্তাহের খরচ</div>
<div class="flex gap-2 mt-2"><input id="expBiboron" placeholder="বিবরণ" class="flex-1 border rounded-xl p-2 text-[12px]"><input id="expTaka" type="number" placeholder="টাকা" class="w-24 border rounded-xl p-2 text-[12px] font-bold"></div>
<button onclick="addExpToList()" class="w-full mt-2 bg-zinc-100 p-2 rounded-xl font-bold text-[12px]">+ খরচ লিস্টে যোগ</button>
<div id="expList" class="mt-2 text-[12px] space-y-1"></div>
</div>
<div class="grid grid-cols-3 gap-2 mt-3">
<div class="bg-emerald-50 p-3 rounded-xl text-center"><div class="text-[10px]">মোট কালেকশন</div><div id="totalCollection" class="font-black">0৳</div></div>
<div class="bg-red-50 p-3 rounded-xl text-center"><div class="text-[10px]">মোট খরচ</div><div id="totalExpense" class="font-black">0৳</div></div>
<div class="bg-black text-white p-3 rounded-xl text-center"><div class="text-[10px] text-zinc-300">অবশিষ্ট → ফান্ডে</div><div id="totalRemain" class="font-black">0৳</div></div>
</div>
<button onclick="saveWeeklyFinal()" class="w-full mt-3 bg-emerald-600 text-white p-4 rounded-xl font-black">✅ এই শিট সেভ করুন (তারিখ সহ সংরক্ষণ)</button>
</div>
<div class="p-3 border-t mt-4">
<div class="flex gap-2"><input id="searchWeekly" placeholder="মাস/সাল লিখে সার্চ (2026-09)" class="flex-1 border-2 rounded-full px-4 py-3 text-[13px] font-bold"><button onclick="searchWeekly()" class="px-5 bg-black text-white rounded-full font-bold text-[12px]">সার্চ</button></div>
<div id="weeklyHistory" class="mt-4 space-y-3"></div>
</div>
</div>

<div id="tab-islamic" class="hidden">
<div class="p-4 bg-amber-50 border-y">
<div class="font-black text-[13px]">আয়োজিত অনুষ্ঠানটির নাম *</div>
<input id="eventName" placeholder="যেমন: ঈদে মিলাদুন্নবী মাহফিল" class="w-full border-2 rounded-xl p-3 mt-2 text-[13px] font-bold">
<div class="mt-4 font-bold text-[12px]">সহযোগিতা ফর্ম (খালি থাকলেও সেভ হবে)</div>
<div class="grid grid-cols-2 gap-2 mt-2">
<input id="islName" placeholder="নাম" class="border rounded-xl p-3 text-[12px]">
<input id="islPorichoy" placeholder="পরিচয়" class="border rounded-xl p-3 text-[12px]">
<input id="islTaka" type="number" placeholder="টাকার পরিমাণ" class="border rounded-xl p-3 text-[12px] font-bold">
<input id="islData" placeholder="দাতা" class="border rounded-xl p-3 text-[12px]">
</div>
<button onclick="addIslamicDraft()" class="w-full mt-2 bg-black text-white p-3 rounded-xl font-black text-[12px]">➕ এই অনুষ্ঠানে এড করুন (লিস্টে জমা হবে)</button>
<div id="islamicDraftList" class="mt-3 text-[12px] bg-white rounded-xl p-3 border"></div>
<div class="mt-3 grid grid-cols-2 gap-2"><input id="islExp" type="number" placeholder="অনুষ্ঠান খরচ" class="border rounded-xl p-3 text-[12px]"><button onclick="finalIslamicSave()" id="finalBtn" class="bg-emerald-600 text-white p-3 rounded-xl font-black text-[12px]">✅ ফাইনাল সেভ (Google Sheet এ যাবে)</button></div>
</div>
<div id="islamicHistory" class="p-3 space-y-3"></div>
</div>

<div class="p-4 border-t bg-zinc-50"><b class="text-[12px]">🏦 সংগঠন ফান্ড (অটো +/-)</b><div id="fundView" class="mt-2 text-[12px]"></div></div>
</div>

<div id="pinModal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4"><div class="bg-white rounded-2xl p-5 w-full max-w-sm"><div class="font-black text-lg">নিরাপদ প্রবেশ</div><input id="pinInput" type="password" class="border-2 rounded-xl p-3 w-full mt-3" placeholder="PIN (PM)"><div class="flex gap-2 mt-3"><button onclick="closePin()" class="border rounded-xl p-3 flex-1 font-bold">বন্ধ</button><button onclick="login()" class="bg-emerald-700 text-white rounded-xl p-3 flex-1 font-black">প্রবেশ</button></div><div id="pinError" class="text-rose-600 text-[12px] mt-2"></div></div></div>

<div id="poster" class="hidden fixed left-[-99999px] top-0 poster-box">
<div class="flex items-center gap-3 border-b-4 border-emerald-700 pb-3"><img src="https://i.ibb.co/3mQ0XzK/logo.png" class="w-16 h-16 rounded-full"><div><div class="font-black text-[18px]">লতিফিয়া সংগঠন মীরের গাঁও</div><div id="pWeek" class="text-[12px] font-bold"></div></div></div>
<div id="pBody" class="mt-4"></div>
<div id="pTotal" class="mt-4 bg-black text-white p-3 rounded-xl text-center font-black"></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzT1QfvGyAYy1Viigx621tXRz9GJakKI1Cp16q50ltGABVrom5FPxgJrDeaCVVW_VeRzQ/exec";
let IS_ADMIN=false, PIN="", WEEK_ID=getWeekId(new Date()), expenses=[];
function getWeekId(d){ const y=d.getFullYear(); const jan1=new Date(y,0,1); const w=Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7); return `${y}-W${String(w).padStart(2,'0')}`; }
document.getElementById('weekLabel').innerText = WEEK_ID + " | প্রতি বুধবার অটো ০";
function openPin(){ document.getElementById('pinModal').classList.remove('hidden'); document.getElementById('pinModal').classList.add('flex'); }
function closePin(){ document.getElementById('pinModal').classList.add('hidden'); document.getElementById('pinModal').classList.remove('flex'); }
async function login(){
  const p=document.getElementById('pinInput').value.trim(); if(!p) return;
  const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'test', pin:p})});
  const j=await r.json().catch(()=>({}));
  if(j.status==='wrong_pin'){ document.getElementById('pinError').innerText='❌ ভুল PIN'; return; }
  PIN=p; IS_ADMIN=true; document.getElementById('adminBtn').innerText='✅ এডমিন'; document.getElementById('adminBtn').className='px-4 py-2 rounded-full bg-emerald-600 text-white text-[12px] font-bold'; closePin(); loadAll();
}
function setTab(t){
  document.getElementById('tab-weekly').classList.toggle('hidden', t!=='weekly');
  document.getElementById('tab-islamic').classList.toggle('hidden', t!=='islamic');
  document.getElementById('t-weekly').className = t==='weekly' ? 'p-3 rounded-xl font-black bg-emerald-700 text-white' : 'p-3 rounded-xl font-black bg-zinc-100';
  document.getElementById('t-islamic').className = t==='islamic' ? 'p-3 rounded-xl font-black bg-emerald-700 text-white' : 'p-3 rounded-xl font-black bg-zinc-100';
}
async function loadAll(){ await loadCurrent(); await loadHistory(); await loadFund(); await loadIslamicHistory(); }
async function addMember(){
  if(!IS_ADMIN) return openPin();
  const name=document.getElementById('newName').value.trim();
  const porichoy=document.getElementById('newPorichoy').value.trim();
  if(!name) return alert('নাম দিন');
  const r = await fetch(API,{method:'POST', body: JSON.stringify({action:'addMember', name, porichoy, pin:PIN})});
  const j = await r.json();
  if(j.status=='ok'){ document.getElementById('newName').value=''; document.getElementById('newPorichoy').value=''; loadCurrent(); alert('✅ সদস্য যোগ হয়েছে'); }
  else alert('❌ Error: '+JSON.stringify(j));
}
async function loadCurrent(){
  const r=await fetch(API+'?action=getCurrent'); const vals=await r.json();
  const container=document.getElementById('currentSheet'); container.innerHTML='';
  if(vals.length<=1){ container.innerHTML='<div class="text-[12px] text-zinc-400 text-center py-6">কোনো সদস্য নেই</div>'; return; }
  vals.slice(1).forEach(row=>{
    const name=row[0], porichoy=row[1], taka=row[2]||'', data=row[3]||'';
    const div=document.createElement('div'); div.className='member-card';
    div.innerHTML=`<div class="flex justify-between"><div><div class="font-black text-[13px]">${name}</div><div class="text-[11px] text-zinc-500">B: ${porichoy||'-'}</div></div><div class="text-[10px] bg-zinc-100 px-2 py-1 rounded-full">A: ${name}</div></div>
    <div class="grid grid-cols-2 gap-2 mt-3"><div><div class="text-[10px] font-bold">C: টাকা</div><input data-name="${name}" data-field="taka" value="${taka}" placeholder="0" class="w-full border rounded-xl p-2.5 text-[13px] font-bold"></div><div><div class="text-[10px] font-bold">D: দাতা</div><input data-name="${name}" data-field="data" value="${data}" placeholder="দাতা" class="w-full border rounded-xl p-2.5 text-[12px]"></div></div>`;
    container.appendChild(div);
  });
  calcRemain();
}
function addExpToList(){
  const b=document.getElementById('expBiboron').value; const t=document.getElementById('expTaka').value;
  if(!b||!t) return alert('বিবরণ+টাকা দিন'); expenses.push({biboron:b, taka:t});
  document.getElementById('expBiboron').value=''; document.getElementById('expTaka').value=''; renderExp(); calcRemain();
}
function renderExp(){
  document.getElementById('expList').innerHTML = expenses.map((e,i)=>`<div class="flex justify-between border-b py-1"><span>${e.biboron}</span><span class="font-bold">${e.taka}৳ <button onclick="expenses.splice(${i},1);renderExp();calcRemain()" class="text-red-500 ml-2">x</button></span></div>`).join('');
}
function calcRemain(){
  let total=0; document.querySelectorAll('[data-field="taka"]').forEach(inp=> total+=Number(inp.value||0));
  let expTotal=expenses.reduce((s,e)=>s+Number(e.taka||0),0);
  document.getElementById('totalCollection').innerText = total+'৳';
  document.getElementById('totalExpense').innerText = expTotal+'৳';
  document.getElementById('totalRemain').innerText = (total-expTotal)+'৳';
  return {total, expTotal};
}
async function saveWeeklyFinal(){
  if(!IS_ADMIN) return openPin();
  const {total, expTotal}=calcRemain();
  const items=[]; document.querySelectorAll('.member-card').forEach(card=>{
    const name=card.querySelector('[data-field="taka"]').dataset.name;
    const taka=card.querySelector('[data-field="taka"]').value;
    const data=card.querySelector('[data-field="data"]').value;
    const porichoy=card.querySelector('.text-zinc-500').innerText.replace('B: ','');
    if(taka||data) items.push({name, porichoy, taka, data});
  });
  if(!items.length) return alert('C/D তে কিছু লিখুন');
  const dateStr=new Date().toLocaleDateString('bn-BD');
  const r=await fetch(API,{method:'POST', body: JSON.stringify({action:'saveWeekly', weekId:WEEK_ID, dateStr, items, expenseTotal:expTotal, expenses, pin:PIN})});
  const j=await r.json();
  if(j.status=='ok'){ alert(`✅ সেভ হয়েছে`); expenses=[]; renderExp(); loadHistory(); loadFund(); }
  else alert('Error: '+JSON.stringify(j));
}
async function loadHistory(q=''){
  const r=await fetch(API+`?action=getWeeklyHistory`); const vals=await r.json();
  const container=document.getElementById('weeklyHistory'); container.innerHTML='';
  if(vals.length<=1){ container.innerHTML='<div class="text-[12px] text-zinc-400 text-center">কোনো সেভ করা শিট নেই</div>'; return; }
  const groups={}; vals.slice(1).forEach(row=>{ const wid=row[0]; if(!groups[wid]) groups[wid]=[]; groups[wid].push(row); });
  Object.keys(groups).reverse().forEach(wid=>{
    const rows=groups[wid]; const date=rows[0][1]; let total=0; rows.forEach(r=> total+=Number(r[4]||0));
    const div=document.createElement('div'); div.className='border rounded-[18px] p-3 bg-white';
    div.innerHTML=`<div class="flex justify-between items-center"><div><div class="font-black text-[13px]">${wid}</div><div class="text-[11px] text-zinc-500">${date} | মোট: ${total}৳</div></div><div class="flex gap-2"><button onclick="shareWeekly('${wid}')" class="w-8 h-8 bg-emerald-50 rounded-full">📤</button></div></div>`;
    container.appendChild(div);
  });
}
function searchWeekly(){ loadHistory(document.getElementById('searchWeekly').value.trim()); }
async function shareWeekly(wid){
  const r=await fetch(API+`?action=getWeeklyHistory`); const vals=await r.json();
  const all = vals.slice(1).filter(v=>v[0]==wid);
  const poster=document.getElementById('poster'); poster.classList.remove('hidden');
  document.getElementById('pWeek').innerText = wid + ' | ' + all[0][1];
  let total=0; let body=`<table class="w-full text-[12px]"><tr class="bg-emerald-50"><th class="p-2 text-left">নাম</th><th>টাকা</th><th>দাতা</th></tr>`;
  all.forEach(r=>{ total+=Number(r[4]||0); body+=`<tr class="border-b"><td class="p-2 font-bold">${r[2]}</td><td class="p-2 font-bold">${r[4]}</td><td class="p-2">${r[5]}</td></tr>`; }); body+=`</table>`;
  document.getElementById('pBody').innerHTML=body; document.getElementById('pTotal').innerText=`মোট: ${total}৳`;
  const canvas=await html2canvas(document.getElementById('poster'),{scale:2}); const a=document.createElement('a'); a.download=`${wid}.png`; a.href=canvas.toDataURL(); a.click(); poster.classList.add('hidden');
}

let islamicDraft=[]; let currentEventId='EV-'+Date.now(); let currentEventName='';
function addIslamicDraft(){
  if(!IS_ADMIN) return openPin();
  const name=document.getElementById('islName').value.trim();
  const porichoy=document.getElementById('islPorichoy').value.trim();
  const taka=document.getElementById('islTaka').value.trim();
  const data=document.getElementById('islData').value.trim();
  const eventName=document.getElementById('eventName').value.trim();
  if(!eventName) return alert('অনুষ্ঠানের নাম লিখুন');
  if(!name && !taka) return alert('অন্তত নাম বা টাকা দিন');
  currentEventName=eventName;
  islamicDraft.push({name, porichoy, taka, data});
  renderIslamicDraft();
  document.getElementById('islName').value=''; document.getElementById('islPorichoy').value=''; document.getElementById('islTaka').value=''; document.getElementById('islData').value='';
}
function renderIslamicDraft(){
  const box=document.getElementById('islamicDraftList');
  if(!islamicDraft.length){ box.innerHTML='<div class="text-zinc-400 text-[11px]">➕ বাটনে ক্লিক করে যোগ করুন, তারপর ফাইনাল সেভ দিন</div>'; return; }
  box.innerHTML = islamicDraft.map((d,i)=>`<div class="flex justify-between border-b py-2 text-[12px]"><span><b>${d.name||'-'}</b> ${d.porichoy? '('+d.porichoy+')':''} | ${d.taka||0}৳ ${d.data? '- '+d.data:''}</span><button onclick="islamicDraft.splice(${i},1);renderIslamicDraft()" class="text-red-500 font-bold px-2">x</button></div>`).join('')+`<div class="mt-2 text-[11px] font-bold">মোট: ${islamicDraft.length} জন, ${islamicDraft.reduce((s,e)=>s+Number(e.taka||0),0)}৳</div>`;
}
async function finalIslamicSave(){
  if(!IS_ADMIN) return openPin();
  if(!currentEventName) currentEventName = document.getElementById('eventName').value.trim();
  if(!currentEventName) return alert('অনুষ্ঠানের নাম দিন');
  if(!islamicDraft.length) return alert('অন্তত একজন যোগ করুন - ওপরে ➕ বাটনে ক্লিক করুন');
  const dateStr=new Date().toLocaleDateString('bn-BD');
  const exp=document.getElementById('islExp').value||0;
  const btn=document.getElementById('finalBtn');
  btn.innerText='⏳ সেভ হচ্ছে...'; btn.disabled=true;
  try{
    const res = await fetch(API,{method:'POST', body: JSON.stringify({action:'saveIslamicFinal', eventId: currentEventId, eventName: currentEventName, dateStr, items: islamicDraft, expenseTotal: exp, pin: PIN})});
    const j = await res.json();
    if(j.status=='ok'){
      alert('✅ ইসলামিক শিট Google Sheet এ সেভ হয়েছে');
      islamicDraft=[]; currentEventId='EV-'+Date.now(); currentEventName='';
      document.getElementById('eventName').value=''; document.getElementById('islExp').value='';
      renderIslamicDraft(); loadIslamicHistory(); loadFund();
    } else { alert('❌ Error: '+JSON.stringify(j)); }
  }catch(e){ alert('❌ নেটওয়ার্ক Error: '+e.message); }
  finally{ btn.innerText='✅ ফাইনাল সেভ (Google Sheet এ যাবে)'; btn.disabled=false; }
}
async function loadIslamicHistory(){
  const r=await fetch(API+'?action=getIslamicHistory'); const vals=await r.json();
  const c=document.getElementById('islamicHistory'); c.innerHTML='';
  if(vals.length<=1){ c.innerHTML='<div class="text-[12px] text-zinc-400 text-center">কোনো ইসলামিক শিট নেই</div>'; return; }
  const groups={}; vals.slice(1).forEach(row=>{ const eid=row[0]; if(!groups[eid]) groups[eid]=[]; groups[eid].push(row); });
  Object.keys(groups).reverse().forEach(eid=>{
    const rows=groups[eid]; const evName=rows[0][1]; const date=rows[0][2]; let total=0; rows.forEach(r=> total+=Number(r[5]||0));
    const div=document.createElement('div'); div.className='border rounded-[18px] p-3 bg-white';
    div.innerHTML=`<div class="flex justify-between"><div><div class="font-black text-[13px]">${evName}</div><div class="text-[11px] text-zinc-500">${date} | মোট ${total}৳ | ${rows[0][7]}</div></div></div><div class="mt-2 text-[11px]">${rows.map(r=>`<div class="flex justify-between border-b py-1"><span>${r[3]} ${r[4]? '('+r[4]+')':''}</span><span>${r[5]}৳ ${r[6]||''}</span></div>`).join('')}</div>`;
    c.appendChild(div);
  });
}
async function loadFund(){
  const r=await fetch(API+'?action=getFund'); const vals=await r.json();
  let total=0; vals.slice(1).forEach(row=>{ const t=Number(row[3]||0); if(row[4]=='IN') total+=t; else total-=t; });
  const c=document.getElementById('fundView'); c.innerHTML=`<div class="font-black text-[18px] mb-2">বর্তমান ফান্ড: ${total}৳</div>`+vals.slice(1).reverse().slice(0,20).map(row=>`<div class="flex justify-between border-b py-1"><span>${row[0]} ${row[2]}</span><span class="${row[4]=='IN'?'text-emerald-600':'text-red-600'} font-bold">${row[4]=='IN'?'+': '-'}${row[3]}৳</span></div>`).join('');
}
